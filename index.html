<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple Style Clock & AI</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --accent-color: #FF9F0A;
      --secondary-bg: #1C1C1E;
      --gray-text: #8E8E93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; margin: 0; }
    
    main { flex: 1; position: relative; overflow: hidden; }
    
    .tab-content { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; flex-direction: column; overflow-y: auto; padding: 20px; }
    .tab-content.active { display: flex; }
    
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 20px; flex-shrink: 0; }
    .time-display { font-size: 72px; font-weight: 200; font-variant-numeric: tabular-nums; text-align: center; margin: 40px 0; flex-shrink: 0; }
    
    .btn-group { display: flex; justify-content: space-between; padding: 0 20px; margin-bottom: 20px; flex-shrink: 0; }
    .circle-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 16px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-start { background-color: rgba(48, 209, 88, 0.2); color: #30D158; }
    .btn-stop { background-color: rgba(255, 69, 58, 0.2); color: #FF453A; }
    .btn-lap, .btn-reset { background-color: #333333; color: white; }
    
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 15px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; font-size: 18px; font-variant-numeric: tabular-nums; }
    
    .timer-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-shrink: 0; }
    .timer-inputs input { width: 80px; height: 60px; background: var(--secondary-bg); color: white; border: none; border-radius: 10px; font-size: 32px; text-align: center; outline: none; }
    
    #ai { padding: 0; overflow: hidden; }
    
    .ai-header { flex-shrink: 0; padding: 20px; font-size: 24px; font-weight: bold; border-bottom: 1px solid #222; background: var(--bg-color); z-index: 5; }
    
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .message { padding: 12px 18px; border-radius: 20px; max-width: 85%; line-height: 1.5; word-break: break-word; font-size: 16px; }
    .msg-user { background: var(--accent-color); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-ai { background: var(--secondary-bg); color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    .chat-input-wrapper { flex-shrink: 0; display: flex; gap: 10px; padding: 15px 20px; background: rgba(28, 28, 30, 0.95); border-top: 1px solid #333; }
    .chat-input-wrapper input { flex: 1; padding: 15px 20px; border-radius: 25px; border: 1px solid #444; background: #000; color: white; font-size: 16px; outline: none; }
    .chat-input-wrapper input:focus { border-color: var(--accent-color); }
    .chat-input-wrapper button { background: var(--accent-color); color: white; border: none; border-radius: 25px; padding: 0 20px; font-weight: bold; cursor: pointer; font-size: 16px; white-space: nowrap; }

    nav { flex-shrink: 0; width: 100%; height: 70px; background-color: #1C1C1E; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 10; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { color: var(--gray-text); text-align: center; cursor: pointer; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; padding: 10px 0; }
    .nav-item.active { color: var(--accent-color); }
    .nav-icon { font-size: 24px; }
  </style>
</head>
<body>

  <main>
    <section id="world" class="tab-content active">
      <h1>세계 시계</h1>
      <ul id="world-list"></ul>
    </section>

    <section id="stopwatch" class="tab-content">
      <div class="time-display" id="sw-display">00:00.00</div>
      <div class="btn-group">
        <button class="circle-btn btn-reset" id="sw-lap-reset" onclick="swLapOrReset()">랩</button>
        <button class="circle-btn btn-start" id="sw-start-stop" onclick="swStartOrStop()">시작</button>
      </div>
      <ul id="sw-laps"></ul>
    </section>

    <section id="timer" class="tab-content">
      <div class="timer-inputs" id="timer-setup">
        <input type="number" id="t-min" placeholder="00" min="0" max="99"> <span style="font-size:32px; align-self:center;">분</span>
        <input type="number" id="t-sec" placeholder="00" min="0" max="59"> <span style="font-size:32px; align-self:center;">초</span>
      </div>
      <div class="time-display" id="timer-display" style="display:none;">00:00</div>
      <div class="btn-group">
        <button class="circle-btn btn-reset" onclick="tCancel()">취소</button>
        <button class="circle-btn btn-start" id="t-start-pause" onclick="tStartOrPause()">시작</button>
      </div>
    </section>

    <section id="ai" class="tab-content">
      <div class="ai-header">✨ 글로벌 시계 AI</div>
      
      <div id="chat-box">
        <div class="message msg-ai">죄송합니다! 🙇‍♂️ 이제 전 세계 거의 모든 국가와 도시의 시간을 알아들을 수 있게 무적 업그레이드되었습니다. "캐나다 시간", "독일 시간", "두바이 몇 시야?" 편하게 물어보세요! ⏰</div>
      </div>
      
      <div class="chat-input-wrapper">
        <input type="text" id="chat-msg" placeholder="나라나 도시 이름을 물어보세요..." onkeypress="if(event.key==='Enter') sendAI()">
        <button onclick="sendAI()">전송</button>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('world')">
      <div class="nav-icon">🌍</div><span>세계 시계</span>
    </div>
    <div class="nav-item" onclick="switchTab('stopwatch')">
      <div class="nav-icon">⏱️</div><span>스톱워치</span>
    </div>
    <div class="nav-item" onclick="switchTab('timer')">
      <div class="nav-icon">⏳</div><span>타이머</span>
    </div>
    <div class="nav-item" onclick="switchTab('ai')">
      <div class="nav-icon">✨</div><span>AI</span>
    </div>
  </nav>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
      
      if(tabId === 'ai') {
        const box = document.getElementById('chat-box');
        box.scrollTop = box.scrollHeight;
      }
    }

    function updateWorldClock() {
      const cities = [
        { name: '서울', tz: 'Asia/Seoul' },
        { name: '뉴욕', tz: 'America/New_York' },
        { name: '런던', tz: 'Europe/London' }
      ];
      const list = document.getElementById('world-list');
      list.innerHTML = '';
      cities.forEach(city => {
        const time = new Date().toLocaleTimeString('ko-KR', { timeZone: city.tz, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        list.innerHTML += `<li><span>${city.name}</span><span>${time}</span></li>`;
      });
    }
    setInterval(updateWorldClock, 1000);
    updateWorldClock();

    let swTimer, swStartTime = 0, swElapsedTime = 0, swRunning = false;
    function formatSW(ms) {
      const min = String(Math.floor(ms / 60000)).padStart(2, '0');
      const sec = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
      return `${min}:${sec}.${cs}`;
    }
    function updateSW() {
      document.getElementById('sw-display').innerText = formatSW(Date.now() - swStartTime + swElapsedTime);
    }
    function swStartOrStop() {
      const btn = document.getElementById('sw-start-stop');
      const lapBtn = document.getElementById('sw-lap-reset');
      if (swRunning) {
        clearInterval(swTimer);
        swElapsedTime += Date.now() - swStartTime;
        btn.innerText = '시작';
        btn.className = 'circle-btn btn-start';
        lapBtn.innerText = '재설정';
      } else {
        swStartTime = Date.now();
        swTimer = setInterval(updateSW, 10);
        btn.innerText = '중단';
        btn.className = 'circle-btn btn-stop';
        lapBtn.innerText = '랩';
      }
      swRunning = !swRunning;
    }
    function swLapOrReset() {
      if (swRunning) {
        const lapTime = formatSW(Date.now() - swStartTime + swElapsedTime);
        const ul = document.getElementById('sw-laps');
        ul.insertAdjacentHTML('afterbegin', `<li><span>랩 ${ul.children.length + 1}</span><span>${lapTime}</span></li>`);
      } else {
        swElapsedTime = 0;
        document.getElementById('sw-display').innerText = '00:00.00';
        document.getElementById('sw-laps').innerHTML = '';
      }
    }

    let tTimer, tTotalMs = 0, tRunning = false;
    function formatT(ms) {
      const min = String(Math.floor(ms / 60000)).padStart(2, '0');
      const sec = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      return `${min}:${sec}`;
    }
    function updateT() {
      if (tTotalMs <= 0) { clearInterval(tTimer); tRunning = false; alert("타이머 종료!"); tCancel(); return; }
      tTotalMs -= 100;
      document.getElementById('timer-display').innerText = formatT(tTotalMs);
    }
    function tStartOrPause() {
      const setup = document.getElementById('timer-setup');
      const display = document.getElementById('timer-display');
      const btn = document.getElementById('t-start-pause');
      
      if (!tRunning && tTotalMs === 0) {
        const m = parseInt(document.getElementById('t-min').value || 0);
        const s = parseInt(document.getElementById('t-sec').value || 0);
        tTotalMs = (m * 60 + s) * 1000;
        if (tTotalMs === 0) return;
        setup.style.display = 'none';
        display.style.display = 'block';
        display.innerText = formatT(tTotalMs);
      }
      
      if (tRunning) {
        clearInterval(tTimer);
        btn.innerText = '재개';
        btn.className = 'circle-btn btn-start';
      } else {
        tTimer = setInterval(updateT, 100);
        btn.innerText = '일시정지';
        btn.className = 'circle-btn btn-stop';
      }
      tRunning = !tRunning;
    }
    function tCancel() {
      clearInterval(tTimer);
      tRunning = false;
      tTotalMs = 0;
      document.getElementById('timer-setup').style.display = 'flex';
      document.getElementById('timer-display').style.display = 'none';
      const btn = document.getElementById('t-start-pause');
      btn.innerText = '시작';
      btn.className = 'circle-btn btn-start';
    }

    function addMsg(text, type) {
      const box = document.getElementById('chat-box');
      const formattedText = text.replace(/\n/g, '<br>');
      box.innerHTML += `<div class="message ${type}">${formattedText}</div>`;
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function sendAI() {
      const input = document.getElementById('chat-msg');
      const msg = input.value.trim();
      
      if (!msg) return;
      
      addMsg(msg, 'msg-user');
      input.value = ''; 
      
      setTimeout(() => {
        const reply = getClockAIResponse(msg);
        addMsg(reply, 'msg-ai');
      }, 250);
    }

    // 전 세계 주요 국가 및 도시 데이터베이스
    const geoTimeZones = [
      // 미주
      { keywords: ['캐나다', '토론토', '오타와'], name: '캐나다 (토론토 기준)', tz: 'America/Toronto', flag: '🇨🇦' },
      { keywords: ['밴쿠버'], name: '캐나다 (밴쿠버)', tz: 'America/Vancouver', flag: '🇨🇦' },
      { keywords: ['미국', '뉴욕'], name: '미국 (뉴욕)', tz: 'America/New_York', flag: '🇺🇸' },
      { keywords: ['la', '로스앤젤레스', '엘에이'], name: '미국 (로스앤젤레스)', tz: 'America/Los_Angeles', flag: '🇺🇸' },
      { keywords: ['시카고'], name: '미국 (시카고)', tz: 'America/Chicago', flag: '🇺🇸' },
      { keywords: ['하와이', '호놀룰루'], name: '미국 (하와이)', tz: 'Pacific/Honolulu', flag: '🇺🇸' },
      { keywords: ['멕시코', '멕시코시티'], name: '멕시코', tz: 'America/Mexico_City', flag: '🇲🇽' },
      { keywords: ['브라질', '상파울루', '리우'], name: '브라질 (상파울루)', tz: 'America/Sao_Paulo', flag: '🇧🇷' },
      { keywords: ['아르헨티나', '부에노스아이레스'], name: '아르헨티나', tz: 'America/Argentina/Buenos_Aires', flag: '🇦🇷' },

      // 유럽
      { keywords: ['영국', '런던'], name: '영국 (런던)', tz: 'Europe/London', flag: '🇬🇧' },
      { keywords: ['프랑스', '파리'], name: '프랑스 (파리)', tz: 'Europe/Paris', flag: '🇫🇷' },
      { keywords: ['독일', '베를린', '프랑크푸르트'], name: '독일 (베를린)', tz: 'Europe/Berlin', flag: '🇩🇪' },
      { keywords: ['이탈리아', '로마'], name: '이탈리아 (로마)', tz: 'Europe/Rome', flag: '🇮🇹' },
      { keywords: ['스페인', '마드리드', '바르셀로나'], name: '스페인 (마드리드)', tz: 'Europe/Madrid', flag: '🇪🇸' },
      { keywords: ['스위스', '취리히', '베른'], name: '스위스 (취리히)', tz: 'Europe/Zurich', flag: '🇨🇭' },
      { keywords: ['네덜란드', '암스테르담'], name: '네덜란드', tz: 'Europe/Amsterdam', flag: '🇳🇱' },
      { keywords: ['러시아', '모스크바'], name: '러시아 (모스크바)', tz: 'Europe/Moscow', flag: '🇷🇺' },

      // 아시아
      { keywords: ['한국', '대한민국', '서울'], name: '대한민국 (서울)', tz: 'Asia/Seoul', flag: '🇰🇷' },
      { keywords: ['일본', '도쿄'], name: '일본 (도쿄)', tz: 'Asia/Tokyo', flag: '🇯🇵' },
      { keywords: ['중국', '베이징', '북경'], name: '중국 (베이징)', tz: 'Asia/Shanghai', flag: '🇨🇳' },
      { keywords: ['대만', '타이베이', '타이페이'], name: '대만 (타이베이)', tz: 'Asia/Taipei', flag: '🇹🇼' },
      { keywords: ['홍콩'], name: '홍콩', tz: 'Asia/Hong_Kong', flag: '🇭🇰' },
      { keywords: ['베트남', '하노이', '호치민'], name: '베트남 (하노이)', tz: 'Asia/Ho_Chi_Minh', flag: '🇻🇳' },
      { keywords: ['태국', '방콕'], name: '태국 (방콕)', tz: 'Asia/Bangkok', flag: '🇹🇭' },
      { keywords: ['싱가포르', '싱가폴'], name: '싱가포르', tz: 'Asia/Singapore', flag: '🇸🇬' },
      { keywords: ['필리핀', '마닐라'], name: '필리핀', tz: 'Asia/Manila', flag: '🇵🇭' },
      { keywords: ['인도', '뉴델리'], name: '인도 (뉴델리)', tz: 'Asia/Kolkata', flag: '🇮🇳' },
      { keywords: ['튀르키예', '터키', '이스탄불'], name: '튀르키예 (이스탄불)', tz: 'Europe/Istanbul', flag: '🇹🇷' },

      // 오세아니아 / 중동 / 아프리카
      { keywords: ['호주', '오스트레일리아', '시드니'], name: '호주 (시드니)', tz: 'Australia/Sydney', flag: '🇦🇺' },
      { keywords: ['멜버른', '멜번'], name: '호주 (멜버른)', tz: 'Australia/Melbourne', flag: '🇦🇺' },
      { keywords: ['뉴질랜드', '오클랜드'], name: '뉴질랜드 (오클랜드)', tz: 'Pacific/Auckland', flag: '🇳🇿' },
      { keywords: ['두바이', '아랍에미리트', '아부다비'], name: '아랍에미리트 (두바이)', tz: 'Asia/Dubai', flag: '🇦🇪' },
      { keywords: ['이집트', '카이로'], name: '이집트 (카이로)', tz: 'Africa/Cairo', flag: '🇪🇬' },
      { keywords: ['남아공', '남아프리카'], name: '남아프리카공화국', tz: 'Africa/Johannesburg', flag: '🇿🇦' }
    ];

    function getClockAIResponse(userMsg) {
      const q = userMsg.toLowerCase().replace(/\s+/g, '');
      const now = new Date();

      // 1. 특정 국가/도시 키워드가 포함되어 있는지 최우선 검색
      for (const target of geoTimeZones) {
        if (target.keywords.some(kw => q.includes(kw))) {
          const formattedTime = now.toLocaleTimeString('ko-KR', { 
            timeZone: target.tz, 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
          });
          return `${target.flag} 현재 **${target.name}** 시간은 **${formattedTime}** 입니다.`;
        }
      }

      // 2. 국가명이 지정되지 않은 일반 시간 질문일 경우 (한국 시간)
      if (q.includes('몇시') || q.includes('지금') || q.includes('시간')) {
        const timeNow = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `⏰ 현재 **대한민국 (서울)** 시간은 **${timeNow}** 입니다.`;
      }

      // 3. 인삿말
      if (q.includes('안녕')) {
        return "안녕하세요! 전 세계 어느 나라든 '캐나다 몇 시야?', '독일 시간', '두바이 시간'처럼 물어봐 주시면 바로 알려드립니다! 🌍";
      }

      return "궁금하신 국가나 도시 이름을 넣어 물어봐 주세요! (예: 캐나다, 프랑스, 호주, 뉴욕, 두바이 등) ⏰";
    }
  </script>
</body>
</html>
